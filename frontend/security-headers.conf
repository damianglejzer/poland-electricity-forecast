# Security headers for every page and file (included in each nginx location, because a location
# with its own add_header does not inherit the server-level ones). Keep in sync with vercel.json;
# `npm run build` checks that the script hash below matches index.html.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-yuhBp1PELsppt2H0Sr2S6MWfk/1pAOFz4Ndb/c1v1kk='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.onrender.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
