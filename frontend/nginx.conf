server {
  listen 80;
  server_tokens off;
  client_max_body_size 16k;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    # A missing file must be a real 404, never index.html: an old tab asking for a file from a
    # previous build then fails cleanly (and reloads) instead of trying to run HTML as JavaScript.
    try_files $uri =404;
  }
  location / {
    # Always revalidate the HTML, so a new deployment is picked up straight away.
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
