[project]
name = "pse-forecast"
version = "0.1.0"
description = "Next-day forecast of Polish national electricity demand (KSE) with a FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "pandas>=2.2",
    "numpy>=2.0",
    "lightgbm>=4.5",
    "pandera>=0.22",
    "holidays>=0.70",
    "mlflow-skinny==2.22.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pse_forecast"]

[tool.uv]
# Only resolve packages published before this date (supply-chain hygiene).
exclude-newer = "2026-09-20T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`:Warning"]
